name: CI

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile core scripts
        run: >-
          python -B -m py_compile
          play_research_adaptive.py
          play_step_0902.py
          play_step_09.py
          step_01.py
          tools/verify_baseline_freeze.py

      - name: Verify frozen tempo baseline
        run: python -B tools/verify_baseline_freeze.py
