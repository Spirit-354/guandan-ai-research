name: CI

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feature-test dependency
        run: python -m pip install numpy

      - name: Compile core scripts
        run: >-
          python -B -m py_compile
          play_research_adaptive.py
          play_step_0902.py
          play_step_09.py
          step_01.py
          danzero_features.py
          website_shadow.py
          danzero_dmc.py
          danzero_oracle.py
          tools/danzero_oracle_audit.py
          tools/test_danzero_dmc.py
          tools/test_danzero_features.py
          tools/test_website_shadow.py
          tools/danzero_feature_sanity.py
          tools/verify_baseline_freeze.py

      - name: Test DanZero feature encoding
        run: >-
          python -B tools/test_danzero_features.py &&
          python -B tools/test_website_shadow.py &&
          python -B tools/test_danzero_dmc.py

      - name: Verify frozen tempo baseline
        run: python -B tools/verify_baseline_freeze.py
